[project]
name = "rag"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "fire>=0.7.1",
    "pydantic>=2.13.5",
    "torch>=2.14.1",
    "tqdm>=4.70.0",
    "transformers>=5.20.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
